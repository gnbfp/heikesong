<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三扇门：别信旁白</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="IDLE">

  <!-- 顶部：轮次信息 + 常驻全局控制（阶段4 P1） -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-name">三扇门</span>
      <span class="brand-sub">别信旁白</span>
    </div>
    <div id="round-chip" class="chip">第 1 轮</div>
    <div id="mode-chip" class="chip chip-quiet">演示模式</div>
    <nav id="controls">
      <button type="button" id="btn-reset" class="ctrl" title="重置回演示起点">重置</button>
      <button type="button" id="btn-demo" class="ctrl" title="切换演示 / 普通模式">演示模式</button>
      <button type="button" id="btn-shop" class="ctrl ctrl-shop" title="用金币买道具（决策阶段可用）">商店</button>
      <button type="button" id="btn-mute" class="ctrl" aria-pressed="false" title="静音">静音</button>
      <button type="button" id="btn-skip" class="ctrl" title="跳过动画">跳过动画</button>
      <button type="button" id="btn-help" class="ctrl" title="规则与快捷键（?）">规则</button>
      <button type="button" id="btn-settings" class="ctrl" title="设置">设置</button>
    </nav>
  </header>

  <!-- 舞台：三扇门 + 轮次横幅 -->
  <main id="stage">
    <div id="round-banner" class="banner" aria-live="polite"></div>
    <div id="doors" class="doors" role="group" aria-label="三扇门">
      <!-- 三个 .door 由 js/ui.js 渲染 -->
    </div>
    <div id="stage-hint" class="hint"></div>
  </main>

  <!-- 演示提词器（契约 v3 §5.1）：?rehearsal=1 或 #rehearsal 时由 js/ui.js 显示，固定定位不占布局 -->
  <section id="rehearsal" hidden aria-live="polite"><span id="rehearsal-text"></span></section>

  <!-- 新手引导气泡（契约 v4 §4.1）：固定定位，不占布局 -->
  <section id="tutorial" hidden aria-live="polite">
    <div id="tutorial-bubble">
      <h3 id="tutorial-title"></h3>
      <p id="tutorial-text"></p>
      <div id="tutorial-actions">
        <button type="button" id="tutorial-skip" class="modal-btn">跳过</button>
        <button type="button" id="tutorial-next" class="modal-btn primary">下一步</button>
      </div>
    </div>
  </section>

  <!-- 结算彩带层（契约 v4 §4.6）：纯装饰，pointer-events:none -->
  <div id="confetti" hidden aria-hidden="true"></div>

  <!-- 竖屏降级提示（契约 v4 §4.7） -->
  <section id="portrait-hint" hidden>建议横屏体验</section>

  <!-- 旁白条 -->
  <aside id="narrator" aria-live="polite">
    <div class="narrator-avatar" aria-hidden="true">旁白</div>
    <p id="narrator-text" class="narrator-text">……</p>
    <button type="button" id="narrator-skip" class="narrator-skip" hidden>跳过本句</button>
  </aside>

  <!-- HUD：金币 / 怀疑值 / 耐心 -->
  <section id="hud" aria-label="资源">
    <div class="hud-item" id="hud-coins" data-res="coins">
      <span class="hud-label">金币</span><span class="hud-value">100</span>
    </div>
    <div class="hud-item" id="hud-suspicion" data-res="suspicion">
      <span class="hud-label">怀疑值</span><span class="hud-value">2</span>
    </div>
    <div class="hud-item" id="hud-patience" data-res="patience">
      <span class="hud-label">耐心</span><span class="hud-value">3</span>
    </div>
  </section>

  <!-- 决策区：5 个决策按钮 -->
  <section id="decide" hidden>
    <button type="button" class="decide-btn" data-choice="stick">坚持本门</button>
    <button type="button" class="decide-btn" data-choice="switch">换门</button>
    <button type="button" class="decide-btn" data-choice="challenge">质疑旁白</button>
    <button type="button" class="decide-btn" data-choice="double">加倍下注</button>
    <button type="button" class="decide-btn" data-choice="cashout">收手</button>
  </section>

  <!-- 背包：商店买的道具在这里，决策阶段可点使用 -->
  <section id="bag" class="bag" aria-label="背包" hidden>
    <div id="bag-title" class="bag-title">背包</div>
    <div id="bag-list" class="bag-list"><!-- .bag-slot 由 js/ui.js 渲染 --></div>
    <div id="bag-empty" class="bag-empty">背包空空如也</div>
  </section>

  <!-- 开始遮罩（IDLE） -->
  <section id="boot">
    <h1 class="boot-title">三扇门</h1>
    <p class="boot-sub">一扇大奖，一扇小奖，一扇空门。<br>旁白说的每一句话，都可能是谎。</p>
    <div class="boot-actions">
      <button type="button" id="btn-start" class="primary">开始（演示模式）</button>
      <button type="button" id="btn-start-normal" class="ghost">普通模式</button>
    </div>
  </section>

  <!-- 结算 / 图鉴弹层 -->
  <div id="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" class="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <!-- 瞬时提示 -->
  <div id="toast" class="toast" hidden></div>

  <footer id="footer">游戏内金币纯属娱乐，非真实货币 · 零构建静态 Demo</footer>

  <!-- 零构建：经典脚本按序加载，file:// 双击可直接运行（不使用 ES module / fetch） -->
  <script src="js/state.js"></script>
  <script src="js/data.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/narrator.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
